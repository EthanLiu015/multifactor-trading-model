[project]
name = "multifactor-trading-system"
version = "0.1.0"
description = "Multifactor equity trading system - research stack"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.42",
    "wrds>=3.2",
    "yfinance>=1.5",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
