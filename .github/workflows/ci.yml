name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  cpp-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: engine/build/_deps
          key: engine-deps-${{ hashFiles('engine/CMakeLists.txt', 'engine/tests/CMakeLists.txt') }}
      - run: cmake -S engine -B engine/build
      - run: cmake --build engine/build -j
      - run: ctest --test-dir engine/build --output-on-failure
